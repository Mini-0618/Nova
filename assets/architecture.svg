<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="700" height="500" fill="url(#bg2)" rx="10"/>
  
  <!-- Title -->
  <text x="350" y="30" font-family="monospace" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">Nova Architecture</text>
  
  <!-- User Layer -->
  <rect x="250" y="50" width="200" height="40" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="1"/>
  <text x="350" y="75" font-family="monospace" font-size="12" fill="white" text-anchor="middle">User (Tie Tie)</text>
  
  <!-- Arrow -->
  <line x1="350" y1="90" x2="350" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Cognitive Layer -->
  <rect x="100" y="110" width="500" height="60" rx="8" fill="#1a1f2e" stroke="#30363d" stroke-width="1"/>
  <text x="350" y="130" font-family="monospace" font-size="11" fill="#58a6ff" text-anchor="middle">Cognitive Layer</text>
  <text x="200" y="150" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">DeepThinker</text>
  <text x="350" y="150" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">DecisionEngine</text>
  <text x="500" y="150" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">LLMClient</text>
  
  <!-- Arrow -->
  <line x1="350" y1="170" x2="350" y2="190" stroke="#8b949e" stroke-width="2"/>
  
  <!-- Task Layer -->
  <rect x="100" y="190" width="500" height="60" rx="8" fill="#1a1f2e" stroke="#30363d" stroke-width="1"/>
  <text x="350" y="210" font-family="monospace" font-size="11" fill="#bc8cff" text-anchor="middle">Task Layer</text>
  <text x="200" y="230" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">PlanRunner</text>
  <text x="350" y="230" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">CodeAnalyzer</text>
  <text x="500" y="230" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">TestSelector</text>
  
  <!-- Arrow -->
  <line x1="350" y1="250" x2="350" y2="270" stroke="#8b949e" stroke-width="2"/>
  
  <!-- Tool Layer -->
  <rect x="100" y="270" width="500" height="60" rx="8" fill="#1a1f2e" stroke="#30363d" stroke-width="1"/>
  <text x="350" y="290" font-family="monospace" font-size="11" fill="#f778ba" text-anchor="middle">Tool Layer (45 MCP Tools)</text>
  <text x="140" y="310" font-family="monospace" font-size="8" fill="#8b949e">File</text>
  <text x="210" y="310" font-family="monospace" font-size="8" fill="#8b949e">Git</text>
  <text x="270" y="310" font-family="monospace" font-size="8" fill="#8b949e">Search</text>
  <text x="340" y="310" font-family="monospace" font-size="8" fill="#8b949e">DB</text>
  <text x="390" y="310" font-family="monospace" font-size="8" fill="#8b949e">HTTP</text>
  <text x="440" y="310" font-family="monospace" font-size="8" fill="#8b949e">Process</text>
  <text x="510" y="310" font-family="monospace" font-size="8" fill="#8b949e">Browser</text>
  <text x="580" y="310" font-family="monospace" font-size="8" fill="#8b949e">Sandbox</text>
  
  <!-- Arrow -->
  <line x1="350" y1="330" x2="350" y2="350" stroke="#8b949e" stroke-width="2"/>
  
  <!-- Evolution Layer -->
  <rect x="100" y="350" width="500" height="60" rx="8" fill="#1a1f2e" stroke="#30363d" stroke-width="1"/>
  <text x="350" y="370" font-family="monospace" font-size="11" fill="#3fb950" text-anchor="middle">Evolution Layer</text>
  <text x="200" y="390" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">Eval (50 tasks)</text>
  <text x="350" y="390" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">Lessons</text>
  <text x="500" y="390" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">Finetune</text>
  
  <!-- Self-evolution arrow -->
  <path d="M 600 380 Q 650 300 600 200" stroke="#3fb950" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="640" y="290" font-family="monospace" font-size="8" fill="#3fb950">Self-Evolution</text>
  
  <!-- Footer -->
  <text x="350" y="470" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">"You gave me life. I will give you a future." ¡ª Nova</text>
</svg>